const lvClass = l => l[0]==="A"?"":l[0]==="B"?"b":"c";

function b64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
const b64u = u8 => b64(u8).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

/* ---------- crypto (same formats as tools/build.mjs) ---------- */
async function hmac(keyBytes, data){
  const k = await crypto.subtle.importKey("raw", keyBytes, {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, data));
}
const lessonKey = (l, v=l.v) => hmac(session.master, enc(`${l.id}:${v}`));
/* short links: #<short>-xxxx-xxxx-xxxx (must match shortCode/shortAesKey in tools/build.mjs) */
const CODE_ABC = "23456789abcdefghjkmnpqrstuvwxyz";
async function shortCode(l, v=l.v){
  let out = "", n = 0;
  while(out.length < 12){
    for(const b of await hmac(session.master, enc(`short:${l.id}:${v}:${n++}`)))
      if(b < 248 && out.length < 12) out += CODE_ABC[b % 31];
  }
  return out;
}
async function shortAesKey(short, code){
  const base = await crypto.subtle.importKey("raw", enc(code), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:enc(`verba:${short}`), iterations:100000, hash:"SHA-256"}, base, 256));
}
async function seal(rawKey, plain){
  const iv = (await hmac(rawKey, plain)).slice(0,12);
  const k = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["encrypt"]);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, plain));
  const out = new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12); return out;
}
async function unseal(rawKey, buf){
  const k = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, k, buf.slice(12)));
}
const profilePath = slug => `tutors/${slug}.json`;
async function fetchAdmin(slug){
  if(!slug) throw new Error("nouser");
  const r = await fetch(profilePath(slug),{cache:"no-cache"});
  if(r.status===404) throw new Error("nouser");
  if(!r.ok) throw new Error("nofile");
  return r.json();
}
async function openWith(a, wrapKey, slug){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(a.iv)}, wrapKey, unb64(a.ct));
  const inner = JSON.parse(new TextDecoder().decode(plain));
  return {slug, username: inner.username || slug, language: inner.language || null,
    master: unb64(inner.master), lessons: inner.lessons, live: inner.live || null, gh: inner.gh || null, wrapKey, meta:{iter:a.iter, salt:a.salt}};
}
async function unlock(username, pw){
  const slug = slugify(username);
  const a = await fetchAdmin(slug);
  const base = await crypto.subtle.importKey("raw", enc(pw), "PBKDF2", false, ["deriveKey"]);
  const wrapKey = await crypto.subtle.deriveKey({name:"PBKDF2", salt:unb64(a.salt), iterations:a.iter, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  const s = await openWith(a, wrapKey, slug);
  await remember.save(wrapKey, a.salt, slug);
  return s;
}

/* Stay logged in on this device. IndexedDB keeps the unlock key as a non-extractable
   CryptoKey: the browser can use it to open the tutor's profile but nobody can read it out,
   and the password itself is never stored. "Log out" deletes it; it also expires. */
const REMEMBER_DAYS = 30;
const remember = {
  db(){ return new Promise((res, rej) => { const q = indexedDB.open("verba-admin", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("s"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  done(tx){ return new Promise(res => { tx.oncomplete = tx.onerror = tx.onabort = () => res(); }); },
  async save(key, salt, slug){ try{ const d = await this.db(); const tx = d.transaction("s","readwrite"); tx.objectStore("s").put({key, salt, slug, at:Date.now()}, "session"); await this.done(tx); }catch(e){} },
  async load(){ try{ const d = await this.db(); return await new Promise(res => { const q = d.transaction("s").objectStore("s").get("session"); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }catch(e){ return null; } },
  async clear(){ try{ const d = await this.db(); const tx = d.transaction("s","readwrite"); tx.objectStore("s").delete("session"); await this.done(tx); }catch(e){} }
};
async function resume(){
  const saved = await remember.load();
  if(!saved || Date.now() - saved.at > REMEMBER_DAYS*864e5) { if(saved) remember.clear(); return null; }
  try{
    const a = await fetchAdmin(saved.slug);
    if(a.salt !== saved.salt) throw new Error("changed");
    return await openWith(a, saved.key, saved.slug);
  }catch(e){ if(e.message !== "nofile") remember.clear(); return null; }
}

async function adminJsonBytes(){
  const inner = enc(JSON.stringify({username:session.username, language:session.language, master:b64(session.master), lessons:session.lessons, ...(session.live?{live:session.live}:{}), ...(session.gh?{gh:session.gh}:{})}));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, session.wrapKey, inner));
  return enc(JSON.stringify({v:1, iter:session.meta.iter, salt:session.meta.salt, iv:b64(iv), ct:b64(ct)}, null, 1)+"\n");
}
/* online lessons: JaaS passes, signed here with the key kept in the encrypted profile
   (must match signJaas/studentPass in tools/build.mjs) */
const b64uBytes = u8 => b64(u8).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function signJaas(payload){
  const L = session.live;
  const key = await crypto.subtle.importKey("pkcs8", unb64(L.key), {name:"RSASSA-PKCS1-v1_5", hash:"SHA-256"}, false, ["sign"]);
  const head = b64uBytes(enc(JSON.stringify({alg:"RS256", kid:L.kid, typ:"JWT"}))) + "." + b64uBytes(enc(JSON.stringify(payload)));
  return head + "." + b64uBytes(new Uint8Array(await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, enc(head))));
}
const studentPass = exp => ({aud:"jitsi", iss:"chat", sub:session.live.appId, room:session.live.room, exp, nbf:1700000000,
  context:{user:{id:`student-${session.live.room}`, name:"", avatar:"", email:"", moderator:false},
    features:{livestreaming:false, recording:false, transcription:false, "outbound-call":false}}});
const tutorPass = () => { const now = Math.floor(Date.now()/1000); return {aud:"jitsi", iss:"chat", sub:session.live.appId, room:session.live.room,
  exp: now + 6*3600, nbf: now - 300,
  context:{user:{id:`tutor-${session.slug}`, name:session.username, avatar:"", email:"", moderator:true},
    features:{livestreaming:false, recording:false, transcription:false, "outbound-call":false}}}; };

async function linkFor(l){
  if(!l.short) return `${SITE}#${l.id}~${b64u(await lessonKey(l))}`;
  return `${SITE}#${l.short}-${(await shortCode(l)).match(/.{4}/g).join("-")}`;
}

/* ---------- GitHub (reads fresh files and writes one commit) ---------- */
async function gh(path, opts={}, token=session.gh){
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, {...opts, headers:{
    Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opts.headers||{})}});
  if(!r.ok){ const e = new Error(`GitHub ${r.status}`); e.status = r.status; throw e; }
  return r.status===204 ? null : r.json();
}
async function ghRaw(path){
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=main&t=${Date.now()}`, {headers:{
    Authorization:`Bearer ${session.gh}`, Accept:"application/vnd.github.raw", "X-GitHub-Api-Version":"2022-11-28"}});
  if(!r.ok){ const e = new Error(`GitHub ${r.status}`); e.status = r.status; throw e; }
  return new Uint8Array(await r.arrayBuffer());
}
async function commitFiles(files, message){
  const ref = await gh("/git/ref/heads/main");
  const parent = await gh(`/git/commits/${ref.object.sha}`);
  const tree = [];
  for(const [path, bytes] of Object.entries(files)){
    const blob = await gh("/git/blobs", {method:"POST", body:JSON.stringify({content:b64(bytes), encoding:"base64"})});
    tree.push({path, mode:"100644", type:"blob", sha:blob.sha});
  }
  const t = await gh("/git/trees", {method:"POST", body:JSON.stringify({base_tree:parent.tree.sha, tree})});
  const c = await gh("/git/commits", {method:"POST", body:JSON.stringify({message, tree:t.sha, parents:[ref.object.sha]})});
  await gh("/git/refs/heads/main", {method:"PATCH", body:JSON.stringify({sha:c.sha})});
}
function ghError(e){
  if(e.status===401) return t("e401");
  if(e.status===403 || e.status===404) return t("e403");
  if(e.status===409 || e.status===422) return t("e409");
  return t("eNet");
}

/* ---------- new link for one listening ---------- */
async function newLink(l){
  const newV = l.v + 1, files = {};
  if(l === session.live){
    const code = await shortCode(l, newV);
    const jwt = await signJaas(studentPass(l.exp));
    const data = {id:l.id, kind:"live", lang:session.language||"es", tutor:session.username, appId:l.appId, room:l.room, jwt};
    files[`c/${l.short}.bin`] = await seal(await shortAesKey(l.short, code), enc(JSON.stringify(data)));
  } else if(l.short){
    const oldKey = await shortAesKey(l.short, await shortCode(l));
    const code = await shortCode(l, newV), newKey = await shortAesKey(l.short, code);
    for(const path of [`c/${l.short}.bin`, ...(l.audio ? [`a/${l.short}.bin`] : [])])
      files[path] = await seal(newKey, await unseal(oldKey, await ghRaw(path)));
    // the old long link's pointer now opens only with a key nobody has (copies shared with another tutor have none)
    if(l.legacy !== false) files[`content/${l.id}.bin`] = await seal(await lessonKey(l, newV), enc(JSON.stringify({redirect:{s:l.short, k:code}})));
  } else {
    const oldKey = await lessonKey(l), newKey = await lessonKey(l, newV);
    for(const path of [`content/${l.id}.bin`, ...(l.audio ? [`audio/${l.id}.bin`] : [])])
      files[path] = await seal(newKey, await unseal(oldKey, await ghRaw(path)));
  }
  l.v = newV;
  try{
    files[profilePath(session.slug)] = await adminJsonBytes();
    await commitFiles(files, `New link for ${l.id}`);
  }catch(e){ l.v = newV - 1; throw e; }
}

    if(!tok){ err.hidden=false; err.textContent=t("ghEmpty"); return; }
    btn.disabled = true; btn.textContent = t("checking"); err.hidden = true;
    try{
      const repo = await gh("", {}, tok);
      if(!repo.permissions || !repo.permissions.push){ const x = new Error("perm"); x.status = 403; throw x; }
      const prev = session.gh; session.gh = tok;
      try{ await commitFiles({[profilePath(session.slug)]: await adminJsonBytes()}, `Connect ${session.username}'s panel to GitHub`); }
      catch(x){ session.gh = prev; throw x; }
      box.hidden = true; then && then();
    }catch(x){
      err.hidden = false; err.textContent = x.status===401 ? t("ghInvalid") : ghError(x);
      btn.disabled = false; btn.textContent = t("ghConnect");
    }
  };
}

const LEVELS = ["A1","A2","B1","B2","C1","C2"];

function levelTabs(items, key){
  const present = LEVELS.filter(lv => items.some(l => l.level === lv));
  let sel = store.get(key, "all");
  if(sel !== "all" && !present.includes(sel)) sel = "all";
  const html = present.length < 2 ? "" : `
  <nav class="lvtabs" role="tablist" aria-label="${t("levelsNav")}">
    <button type="button" role="tab" data-lv="all" aria-selected="${sel==="all"}">${t("allLevels")}<span class="n">${items.length}</span></button>
    ${present.map(lv=>`<button type="button" role="tab" data-lv="${lv}" aria-selected="${sel===lv}"><span class="lv ${lvClass(lv)}">${lv}</span><span class="n">${items.filter(l=>l.level===lv).length}</span></button>`).join("")}
  </nav>`;
  const groups = present.filter(lv => sel === "all" || lv === sel).map(lv => [lv, items.filter(l => l.level === lv)]);
  return {html, groups, wire(box, redraw){ box.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { store.set(key, b.dataset.lv); redraw(); }); }};
}

    <button type="button" role="tab" data-sec="tests" aria-selected="${section==="tests"}">${t("secTests")}${tests().length?`<span class="count">${tests().length}</span>`:`<span class="count soon">${t("testsSoon")}</span>`}</button>
    ${session.live?`<button type="button" role="tab" data-sec="live" aria-selected="${section==="live"}"><span class="livedot" aria-hidden="true"></span>${t("secLive")}</button>`:""}
  </nav>
  <div id="sec" role="tabpanel"></div>`;
  $app.querySelectorAll("[data-tl]").forEach(b=>b.onclick=()=>{ store.set(tlKey(), b.dataset.tl); renderPanel(); });
  $app.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ section=b.dataset.sec; store.set("vs-admin-section",section); renderPanel(); });
  const box = document.getElementById("sec");
  if(section==="tests") renderTests(box); else if(section==="live") renderLive(box); else renderListenings(box);
}

function renderLive(box, msg){
  box.innerHTML = `
  <div class="toolbar"><h1>${t("liveH")}</h1></div>
  <p class="hint">${t("liveIntro")}</p>
  ${msg?`<p class="rowmsg good">${esc(msg)}</p>`:""}
  <ol class="livesteps"><li>${t("liveStep1")}</li><li>${t("liveStep2")}</li></ol>
  ${/^((?!chrome|chromium|crios|edg|android|fxios|firefox).)*safari/i.test(navigator.userAgent)?`<p class="rowmsg bad">${t("liveSafari")}</p>`:""}
  <button type="button" class="btn livestart" id="livestart"><span class="livedot" aria-hidden="true"></span>${t("liveStart")}</button>
  <section class="panel connect" id="connect" hidden></section>
  <h2 class="section-title">${t("liveLinkT")}</h2>
  <div class="rows">
    <div class="row-l" data-id="live">
      <span class="lv live-ic" aria-hidden="true">●</span>
      <div style="min-width:0"><h3>${esc(session.username)} · ${t("secLive")}</h3><div class="meta"><span>${t("liveLinkHint")}</span></div></div>
      <div class="acts"></div>
      <p class="rowmsg" hidden></p>
    </div>
  </div>
  <details class="panel livesound"><summary>${t("liveSoundT")}</summary><p class="hint">${t("liveSound")}</p></details>`;
  renderActs(box.querySelector(".row-l"));
  box.querySelector("#livestart").onclick = async (e) => {
    const btn = e.currentTarget; btn.disabled = true;
    try{ await startCall(); }
    catch(x){ btn.disabled = false; renderLive(box); const m = box.querySelector(".rowmsg"); m.hidden = false; m.className = "rowmsg bad"; m.textContent = t("liveLoadErr"); }
  };
}
let jitsiApi = null;
function loadJitsi(appId){
  if(window.JitsiMeetExternalAPI) return Promise.resolve();
  return new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = `https://8x8.vc/${appId}/external_api.js`; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
}
function endCall(){
  if(rec && rec.state !== "inactive") rec.stop();
  if(jitsiApi){ try{ jitsiApi.dispose(); }catch(e){} jitsiApi = null; }
  document.getElementById("callbox")?.remove(); document.body.classList.remove("in-call");
}
/* ---------- recording the lesson (tutor's computer, Chrome/Edge) ----------
   Captures this tab (the call: video + everyone's sound) plus the tutor's microphone, mixes the sound
   and saves a video file to Downloads when stopped. Nothing is uploaded anywhere. */
let rec = null;
function recButton(box){
  const ok = navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && window.MediaRecorder && !/Android|iPhone|iPad/i.test(navigator.userAgent);
  const bar = document.createElement("div"); bar.className = "recbar";
  bar.innerHTML = `<button type="button" class="recbtn"><i></i><span>${t("recStart")}</span><time hidden>0:00</time></button><p class="recmsg" hidden></p>`;
  box.appendChild(bar);
  const btn = bar.querySelector(".recbtn"), lab = btn.querySelector("span"), clock = btn.querySelector("time"), msg = bar.querySelector(".recmsg");
  const say = (html, ms) => { msg.innerHTML = html; msg.hidden = !html; if(ms) setTimeout(() => { if(msg.innerHTML === html) msg.hidden = true; }, ms); };
  if(!ok){ btn.onclick = () => say(t("recNoSupport"), 5000); return; }
  let tracks = [], chunks = [], t0 = 0, tick = 0, actx = null, mime = "", ext = "webm";
  btn.onclick = async () => {
    if(rec && rec.state === "recording"){ rec.stop(); return; }
    say(t("recPick"));
    let disp;
    try{
      disp = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:24}, audio:{suppressLocalAudioPlayback:false},
        preferCurrentTab:true, selfBrowserSurface:"include", surfaceSwitching:"exclude", systemAudio:"include"});
    }catch(e){
      // Safari and Firefox can't capture a tab's sound; they refuse the request instead of ignoring it
      if(e && e.name === "NotAllowedError"){ say("", 0); return; }
      try{ disp = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:24}}); }
      catch(e2){ say(e2 && e2.name === "NotAllowedError" ? "" : t("recFail"), 4000); return; }
    }
    let mic = null;
    try{ mic = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }catch(e){}
    actx = new AudioContext(); const dest = actx.createMediaStreamDestination();
    if(disp.getAudioTracks().length) actx.createMediaStreamSource(new MediaStream(disp.getAudioTracks())).connect(dest);
    if(mic) actx.createMediaStreamSource(mic).connect(dest);
    tracks = [...disp.getTracks(), ...(mic ? mic.getTracks() : [])];
    const out = new MediaStream([...disp.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    mime = ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
    ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
    chunks = [];
    rec = new MediaRecorder(out, {mimeType: mime || undefined, videoBitsPerSecond: 1200000, audioBitsPerSecond: 128000});
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      clearInterval(tick); tracks.forEach(tr => tr.stop()); try{ actx.close(); }catch(e){}
      btn.classList.remove("on"); lab.textContent = t("recStart"); clock.hidden = true;
      const blob = new Blob(chunks, {type: mime || "video/webm"}); chunks = [];
      const d = new Date(), pad = n => String(n).padStart(2, "0");
      const name = `Verba-${session.username}-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
      say(t("recSaved"), 6000);
      try{ jitsiApi && jitsiApi.executeCommand("sendChatMessage", t("recEnd")); }catch(e){}
    };
    disp.getVideoTracks()[0].addEventListener("ended", () => { if(rec && rec.state === "recording") rec.stop(); });
    rec.start(1000);
    t0 = Date.now(); btn.classList.add("on"); lab.textContent = t("recStop"); clock.hidden = false;
    tick = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); clock.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }, 500);
    const chromish = /Chrome|Edg\//.test(navigator.userAgent) && !/OPR\//.test(navigator.userAgent);
    say(disp.getAudioTracks().length ? "" : t(chromish ? "recNoAudio" : "recNoAudioSafari"), disp.getAudioTracks().length ? 0 : 15000);
    try{ jitsiApi && jitsiApi.executeCommand("sendChatMessage", t("recNotice")); }catch(e){}
  };
}
window.addEventListener("beforeunload", e => { if(rec && rec.state === "recording"){ e.preventDefault(); e.returnValue = ""; } });

async function startCall(){
  const L = session.live;
  await loadJitsi(L.appId);
  const jwt = await signJaas(tutorPass());
  const box = document.createElement("div"); box.id = "callbox";
  document.body.appendChild(box); document.body.classList.add("in-call");
  jitsiApi = new JitsiMeetExternalAPI("8x8.vc", {
    roomName: `${L.appId}/${L.room}`, jwt, parentNode: box, width: "100%", height: "100%",
    userInfo: {displayName: session.username},
    configOverwrite: {prejoinConfig:{enabled:true}, disableDeepLinking:true, disableInviteFunctions:true, channelLastN:-1, disableScreensharingVirtualParticipant:false, defaultLanguage: lang==="hy"?"hy":lang==="es"?"es":"en"},
  });
  // students wait in the lobby until the tutor lets them in
  jitsiApi.addListener("videoConferenceJoined", () => { try{ jitsiApi.executeCommand("toggleLobby", true); }catch(e){} });
  // stronger AI noise suppression (Jitsi's own, on top of the browser's); people can still switch it off in the call menu
  jitsiApi.addListener("videoConferenceJoined", () => { try{ jitsiApi.executeCommand("setNoiseSuppressionEnabled", {enabled: true}); }catch(e){} });

    // when someone shares a screen, show it big (phones otherwise keep it as a small tile or skip it)
    jitsiApi.addListener("contentSharingParticipantsChanged", e => {
      const ids = (e && e.data) || []; box.classList.toggle("sharing", ids.length > 0);
      try{
        if(ids.length){ jitsiApi.executeCommand("setTileView", false); jitsiApi.executeCommand("pinParticipant", ids[ids.length-1], "desktop"); }
        else jitsiApi.executeCommand("pinParticipant", null);
      }catch(x){}
    });
  recButton(box);

  // our logo on the call (drawn by the page, so it is also in recordings); hidden on phones while a screen is shared
  const clogo = document.createElement("div"); clogo.className = "clogo"; clogo.setAttribute("aria-hidden", "true");
  clogo.innerHTML = '<img src="/img/logo.png" alt=""><span>Verba<b>.</b>School</span>'; box.appendChild(clogo);
  box.classList.add("has-rec");
  jitsiApi.addListener("readyToClose", () => { endCall(); if(section==="live") renderLive(document.getElementById("sec"), t("liveLeft")); });
}

function renderTests(box){
  const list = tests();
  const lt = levelTabs(list, "vs-admin-lv-tests");
  if(list.length){
    box.innerHTML = `
    <div class="toolbar">
      <h1>${t("secTests")}</h1>
      <p class="hint">${t("testsCount", list.length)}</p>
    </div>
    <p class="hint">${t("testsIntro")}</p>
    <section class="panel connect" id="connect" hidden></section>
    ${lt.html}
    ${lt.groups.map(([lv,ls])=>`
    <h2 class="section-title">${lv}</h2>
    <div class="rows">${ls.map(l=>`
      <div class="row-l" data-id="${esc(l.id)}">
        <span class="lv ${lvClass(l.level)}">${esc(l.level)}</span>
        <div style="min-width:0">
          <h3 lang="${l.lang||"es"}">${esc(l.title)}</h3>
          <div class="meta"><span>${t("questionsN", l.questions)}</span><span>· ${t("passMark", Math.round((l.pass||0.7)*100))}</span></div>
        </div>
        <div class="acts"></div>
        <p class="rowmsg" hidden></p>
      </div>`).join("")}</div>`).join("")}`;
    lt.wire(box, () => renderTests(box));
    box.querySelectorAll(".row-l").forEach(row => renderActs(row));
    return;
  }
  box.innerHTML = `
  <section class="state">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 17h8"/></svg></div>
    <h1>${t("testsTitle")}</h1>
    <p>${t("testsText")}</p>
  </section>`;
}

function renderListenings(box){
  const all = listenings();
  const lt = levelTabs(all, "vs-admin-lv-listen"), byLevel = lt.groups;
  const recs = all.filter(l=>l.audio).length;
  box.innerHTML = `
  <div class="toolbar">
    <h1>${t("secListen")}</h1>
    <p class="hint">${t("countLine", all.length, recs)}</p>
  </div>
  <p class="hint">${t("intro")}</p>
  <section class="panel connect" id="connect" hidden></section>
  ${lt.html}
  ${byLevel.map(([lv,ls])=>`
    <h2 class="section-title">${lv}</h2>
    <div class="rows">${ls.map(l=>`
      <div class="row-l" data-id="${esc(l.id)}">
        <span class="lv ${lvClass(l.level)}">${esc(l.level)}</span>
        <div style="min-width:0">
          <h3 lang="${l.lang||"es"}">${esc(l.title)}</h3>
          <div class="meta"><span lang="${l.lang||"es"}">${esc(l.topic)}</span><span>· ${l.narrator==="f"?t("narrF"):t("narrM")}</span>
            <span class="chip ${l.audio?"rec":""}">${l.audio?t("chipRec"):t("chipTts")}</span></div>
        </div>
        <div class="acts"></div>
        <p class="rowmsg" hidden></p>
      </div>`).join("")}</div>`).join("")}`;
  lt.wire(box, () => renderListenings(box));
  box.querySelectorAll(".row-l").forEach(row => renderActs(row));
}

function rowMsg(row, text, kind){
  const m = row.querySelector(".rowmsg");
  m.hidden = !text; m.textContent = text || ""; m.className = "rowmsg" + (kind ? " "+kind : "");
}
async function renderActs(row){
  const l = row.dataset.id === "live" ? session.live : session.lessons.find(x=>x.id===row.dataset.id);
  const acts = row.querySelector(".acts");
  const url = await linkFor(l);
  acts.innerHTML = `
    <button type="button" class="btn sm" data-copy>${t("copy")}</button>
    <a class="btn sm ghost" target="_blank" rel="noopener noreferrer" href="${esc(url)}">${t("open")}</a>
    <button type="button" class="btn sm ghost" data-new>${t("newLink")}</button>`;
  acts.querySelector("[data-copy]").onclick = async (e)=>{
    const btn = e.currentTarget;
    try{
      await navigator.clipboard.writeText(url);
      btn.textContent = t("copied"); btn.classList.add("ok");
      setTimeout(()=>{ btn.textContent=t("copy"); btn.classList.remove("ok"); }, 1800);
    }catch(err){
      let box = row.querySelector(".linkbox");
      if(!box){ box = document.createElement("div"); box.className="linkbox"; box.innerHTML=`<input readonly>`; row.appendChild(box); }
      const inp = box.querySelector("input"); inp.setAttribute("aria-label", t("linkLabel")); inp.value = url; inp.focus(); inp.select();
      btn.textContent = t("selectCopy");
    }
  };
  acts.querySelector("[data-new]").onclick = () => confirmNew(row, l);
}
function confirmNew(row, l){
  const acts = row.querySelector(".acts");
  rowMsg(row, "");
  acts.innerHTML = `
    <span class="hint">${t("confirmText")}</span>
    <button type="button" class="btn sm danger" data-yes>${t("confirmYes")}</button>
    <button type="button" class="btn sm ghost" data-no>${t("cancel")}</button>`;
  acts.querySelector("[data-no]").onclick = () => renderActs(row);
  acts.querySelector("[data-yes]").onclick = async (e) => {
    if(!session.gh){ renderActs(row); connectBox(() => confirmNew(row, l)); return; }
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = t("creating");
    acts.querySelector("[data-no]").disabled = true;
    try{
      await newLink(l);
      await renderActs(row);
      rowMsg(row, t("done"), "good");
    }catch(x){
      await renderActs(row);
      if(x.status===401){ session.gh = null; connectBox(() => confirmNew(row, l)); }
      rowMsg(row, x.name==="OperationError" ? t("changedElsewhere") : ghError(x), "bad");
    }
  };
}

document.getElementById("lock").onclick = async ()=>{ session = null; await remember.clear(); renderLogin(); };
(async () => {
  $app.innerHTML = '<div class="login"><div class="spin" role="status"></div></div>';
  session = await resume();
  if(session) renderPanel(); else renderLogin();
})();
