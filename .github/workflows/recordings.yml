name: Prepare recordings

# Upload a recording as audio/full/<lesson-id>.wav (or .mp3/.m4a) and this
# converts it to MP3 and works out where each sentence starts.
on:
  push:
    branches: [main]
    paths: ["audio/full/**", tools/align.py, .github/workflows/recordings.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: python3 tools/align.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio/full
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Prepare recordings"
          git pull --rebase -q origin main
          git push
