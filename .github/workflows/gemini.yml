name: Generate Gemini voices

on:
  push:
    branches: [main]
    paths: [index.html, tools/gemini_tts.py, tools/paragraphs.js, .github/workflows/gemini.yml]
  schedule:
    - cron: "17 3 * * *"     # daily, to finish any files left when the free quota ran out
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Generate missing Gemini MP3s
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/gemini_tts.py
      - name: Commit audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add Gemini voice audio"
          git pull --rebase -q origin main
          git push
