<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Verba School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">

<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><b>Verba<span>.</span>School</b></a>
  </header>
  <main id="app"></main>
  <footer>Verba School · Comprensión auditiva en español, niveles A1–C1 según el MCER.</footer>
</div>

<script>
/* Each listening is encrypted. A student link looks like  #<lesson-id>~<key>
   and the key opens that one lesson only. Keys never leave the browser
   (the part after # is not sent to the server). */
const $app = document.getElementById("app");
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lvClass = l => l[0]==="A"?"":l[0]==="B"?"b":"c";
const ICON_HEAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>';
const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ---------- crypto ---------- */
function unb64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function openFile(keyB64u, url){
  const r = await fetch(url,{cache:"no-cache"});
  if(!r.ok) throw new Error("missing");
  const buf = new Uint8Array(await r.arrayBuffer());
  const k = await crypto.subtle.importKey("raw", unb64u(keyB64u), "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, k, buf.slice(12)));
}
// lessons this browser has opened: {id: {k, title, level}}
let vault = store.get("vs-vault",{});
const saveVault = () => store.set("vs-vault",vault);

/* ---------- speech ---------- */
const synth = window.speechSynthesis;
let voices = [];
function vScore(v){let s=0;const n=v.name;if(/natural|neural/i.test(n))s+=50;if(/premium/i.test(n))s+=45;if(/enhanced|mejorad/i.test(n))s+=40;if(/google/i.test(n))s+=25;if(!v.localService)s+=5;if(v.lang==='es-ES')s+=3;if(/eloquence|compact|espeak/i.test(n))s-=30;return s;}
let player = {sentences:[],idx:0,playing:false,paused:false,rate:store.get("vs-rate",0.9),voice:store.get("vs-voice5","r:main")};
let rec = null;      // {duration, starts[]} when the lesson has a recording
let recUrl = null;   // blob: URL of the decrypted recording
function loadVoices(){ if(!synth) return; voices = synth.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a)); fillVoiceSelect(); }
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }

function effectiveVoice(){ return (player.voice.startsWith("r:") && !recUrl) ? (voices[0]?voices[0].name:"") : player.voice; }
function fillVoiceSelect(){
  const sel = document.getElementById("voice"); if(!sel) return;
  const cur = effectiveVoice();
  const opt = (val,label)=>`<option value="${esc(val)}" ${val===cur?"selected":""}>${esc(label)}</option>`;
  sel.innerHTML = (recUrl ? `<optgroup label="Grabación">${opt("r:main","★ Voz principal")}</optgroup>` : "")
    + (voices.length ? `<optgroup label="Voces del dispositivo">${voices.map(v=>opt(v.name,v.name+" · "+v.lang)).join("")}</optgroup>`
                     : (recUrl ? "" : `<option value="">Voz española del dispositivo</option>`));
}
function note(html,warn){ const n=document.getElementById("anote"); if(n){ n.className="note"+(warn?" warn":""); n.innerHTML=html; } }

const audio = new Audio(); audio.preload = "auto";
try{ audio.preservesPitch = true; }catch(e){}
let mode = null;   // "rec" | "tts"
const recRate = () => player.rate/0.9;

function speakFrom(i){
  halt();
  player.idx = i; player.playing = true; player.paused = false; updatePlayerUI();
  if(!player.sentences[i]){ stop(true); return; }
  if(effectiveVoice().startsWith("r:")) playRec(i); else doSpeak(i);
}
function recIndex(t){ let k=0; for(let j=0;j<rec.starts.length;j++){ if(t>=rec.starts[j]-0.02) k=j; else break; } return k; }
function recHandlers(){
  audio.ontimeupdate = () => { if(!player.playing || !rec) return; const k=recIndex(audio.currentTime); if(k!==player.idx){ player.idx=k; updatePlayerUI(); } };
  audio.onended = () => { if(player.playing) stop(true); };
}
function playRec(i){
  mode = "rec";
  if(audio.src !== recUrl) audio.src = recUrl;
  audio.playbackRate = recRate();
  const t = Math.max(0, rec.starts[i]);
  const seek = () => { try{ audio.currentTime = t; }catch(e){} };
  if(audio.readyState >= 1) seek(); else audio.onloadedmetadata = () => { audio.onloadedmetadata = null; if(player.idx===i) seek(); };
  recHandlers();
  audio.play().catch(e=>{ if(e.name==="NotAllowedError"){ player.playing=false; updatePlayerUI(); } });
}

let audioOK=false, watchdog=null;
function noAudio(){
  player.playing=false; updatePlayerUI();
  note('⚠️ El audio no funciona dentro de esta vista. Abre la página en <b>Chrome</b>, <b>Safari</b> o <b>Edge</b>.',true);
}
function doSpeak(i){
  mode = "tts";
  if(!synth){ noAudio(); return; }
  const busy = synth.speaking || synth.pending;
  if(busy) synth.cancel();
  try{ synth.resume(); }catch(e){}
  const go = () => {
    if(!(player.playing && player.idx===i)) return;
    const u = new SpeechSynthesisUtterance(player.sentences[i].text);
    u.lang = "es-ES"; u.rate = player.rate;
    const v = voices.find(v=>v.name===effectiveVoice()) || voices[0];
    if(v){ u.voice = v; u.lang = v.lang; }
    u.onstart = () => { audioOK=true; clearTimeout(watchdog); };
    u.onend = () => { if(player.playing && player.idx===i) speakFrom(i+1); };
    u.onerror = (e) => { if(!audioOK && e.error!=='interrupted' && e.error!=='canceled') noAudio(); };
    clearTimeout(watchdog);
    if(!audioOK) watchdog=setTimeout(()=>{ if(!audioOK && player.playing){ synth.cancel(); noAudio(); } },2500);
    synth.speak(u);
  };
  if(busy) setTimeout(go,80); else go();
}
function halt(){
  audio.onended = audio.ontimeupdate = null; audio.pause();
  if(synth && (synth.speaking||synth.pending)) synth.cancel();
}
function pause(){
  if(mode==="rec" && !audio.ended){ audio.pause(); player.playing=false; player.paused=true; updatePlayerUI(); }
  else stop(false);
}
function resume(){
  if(player.paused && mode==="rec"){ player.playing=true; player.paused=false; updatePlayerUI(); recHandlers(); audio.play().catch(()=>speakFrom(player.idx)); return; }
  speakFrom(player.idx>=player.sentences.length?0:player.idx);
}
function applyRate(){
  if(mode==="rec") audio.playbackRate = recRate();
  else if(player.playing) speakFrom(player.idx);
}
function stop(finished){
  halt();
  player.playing = false; player.paused = false;
  if(finished) player.idx = 0;
  updatePlayerUI();
}
function updatePlayerUI(){
  const active = player.playing || player.paused;
  document.querySelectorAll(".s").forEach(el=>el.classList.toggle("now", active && +el.dataset.i===player.idx));
  const btn = document.getElementById("playbtn"); if(!btn) return;
  btn.innerHTML = player.playing
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  btn.setAttribute("aria-label", player.playing?"Pausar":"Reproducir");
  const n = player.sentences.length;
  document.getElementById("barfill").style.width = (n? Math.round(player.idx/n*100):0)+"%";
  document.getElementById("progtxt").textContent = `Frase ${Math.min(player.idx+1,n)} / ${n}`;
  const cur = document.querySelector(".s.now");
  if(cur && player.playing && !document.querySelector(".blur")) cur.scrollIntoView({block:"nearest",behavior:"smooth"});
}

/* ---------- views ---------- */
function renderHome(){
  stop(true);
  const items = Object.entries(vault);
  if(!items.length){
    $app.innerHTML = `
    <section class="state">
      <div class="ico">${ICON_HEAD}</div>
      <h1>Escucha. Entiende. Responde.</h1>
      <p>Tu profesor o profesora te enviará un enlace para cada audición. Ábrelo y la audición aparecerá aquí.</p>
    </section>`;
    return;
  }
  const done = store.get("vs-done",{}), results = store.get("vs-tests",{});
  const hasTests = items.some(([,v])=>v.kind==="test");
  const badge = (id,v) => {
    if(v.kind==="test"){ const r = results[id]; return `<span class="chip">Test</span>` + (r ? `<span class="done ${r.passed?"":"miss"}">${r.passed?"✓ Aprobado":"No aprobado"} · ${r.score}/${r.total}</span>` : ""); }
    return done[id]!=null ? `<span class="done">✓ ${done[id]}</span>` : "";
  };
  $app.innerHTML = `
  <h2 class="section-title">${hasTests ? "Mis audiciones y tests" : "Mis audiciones"}</h2>
  <div class="grid">${items.map(([id,v])=>`
    <a class="card" href="#${esc(id)}~${esc(v.k)}">
      <div class="meta"><span class="lv ${lvClass(v.level)}">${esc(v.level)}</span>${badge(id,v)}</div>
      <h3>${esc(v.title)}</h3>
    </a>`).join("")}</div>`;
}
function renderState(kind, title, text){
  stop(true);
  $app.innerHTML = `
  <section class="state ${kind==="bad"?"bad":""}">
    ${kind==="load" ? '<div class="spin" role="status" aria-label="Cargando"></div>' : `<div class="ico">${kind==="bad"?ICON_LOCK:ICON_HEAD}</div>`}
    <h1>${title}</h1>${text?`<p>${text}</p>`:""}
    ${kind==="bad" && Object.keys(vault).length ? '<a class="btn ghost" href="#">Ver mi material</a>' : ""}
  </section>`;
}

let openToken = 0;
async function openLesson(id, k){
  const token = ++openToken;
  renderState("load","Abriendo…");
  let l;
  try{
    l = JSON.parse(new TextDecoder().decode(await openFile(k, `content/${encodeURIComponent(id)}.bin`)));
  }catch(e){
    if(token!==openToken) return;
    if(vault[id] && vault[id].k===k){ delete vault[id]; saveVault(); }
    renderState("bad","Este enlace no funciona","Puede que esté incompleto o que tu profesor/a lo haya cambiado. Pídele un enlace nuevo.");
    return;
  }
  if(token!==openToken) return;
  vault[id] = {k, title:l.title, level:l.level, kind:l.kind||"listening"}; saveVault();
  if(l.kind==="test"){ stop(true); renderTest(l); return; }
  if(recUrl){ URL.revokeObjectURL(recUrl); recUrl=null; }
  rec = null; audio.removeAttribute("src");
  renderLesson(l);
  if(l.rec){
    try{
      const bytes = await openFile(k, `audio/${encodeURIComponent(id)}.bin`);
      if(token!==openToken) return;
      rec = l.rec; recUrl = URL.createObjectURL(new Blob([bytes],{type:"audio/mpeg"}));
      fillVoiceSelect();
      note("★ Voz principal: lectura natural. Toca cualquier frase para escucharla desde ahí.");
    }catch(e){}
  }
}

function renderLesson(l){
  stop(true);
  let si=0;
  player.sentences=[];
  const words = l.sents.flat().join(" ").split(/\s+/).length;
  const paras = l.sents.map(parts =>
    "<p>"+parts.map(t=>{player.sentences.push({text:t}); return `<span class="s" data-i="${si++}">${esc(t)}</span>`}).join(" ")+"</p>"
  ).join("");
  const blurred = store.get("vs-blur",true);
  $app.innerHTML = `
  ${Object.keys(vault).length>1 ? '<a class="back" href="#">← Mi material</a>' : ""}
  <section class="lhead">
    <div class="meta"><span class="lv ${lvClass(l.level)}">${esc(l.level)}</span><span>${esc(l.topic)}</span><span>· ${words} palabras</span><span>· ${l.narrator==="f"?"Narradora":"Narrador"}</span></div>
    <h1>${esc(l.title)}</h1>
  </section>
  <div class="cols">
    <div style="display:grid;gap:18px;min-width:0">
      <section class="panel player" aria-label="Reproductor">
        <div class="row">
          <button class="play" id="playbtn" type="button"></button>
          <div class="prog"><div class="bar"><i id="barfill"></i></div><small id="progtxt"></small></div>
        </div>
        <div class="row">
          <label>Velocidad</label>
          ${[0.7,0.9,1.1].map(r=>`<button type="button" class="ctl ${player.rate===r?"on":""}" data-rate="${r}">${r===0.7?"Lenta":r===0.9?"Normal":"Rápida"}</button>`).join("")}
          <button type="button" class="ctl" id="restart">↺ Desde el inicio</button>
        </div>
        <div class="row"><label for="voice">Voz</label><select id="voice"></select></div>
        ${l.rec ? `<p class="note" id="anote">Cargando la grabación…</p>`
          : synth ? `<p class="note" id="anote">Toca cualquier frase para escucharla desde ahí.</p>`
          : `<p class="note warn" id="anote">⚠️ El audio no funciona dentro de esta vista. Abre la página en <b>Chrome</b>, <b>Safari</b> o <b>Edge</b>.</p>`}
      </section>
      <section class="panel ${blurred?"blur":""}" id="tpanel">
        <div class="tbar"><h2>Transcripción</h2><button type="button" class="tog" id="tog">${blurred?"Mostrar texto":"Ocultar texto"}</button></div>
        <div class="transcript">${paras}</div>
      </section>
    </div>
    <div style="display:grid;gap:18px;min-width:0">
      <section class="panel">
        <h2>¿Has entendido el texto?</h2>
        <div id="quiz">${l.q.map((q,qi)=>`
          <div class="q" data-q="${qi}">
            <p><small>${qi+1}</small>${esc(q[0])}</p>
            ${q[1].map((o,oi)=>`<button type="button" class="opt" data-o="${oi}"><i>${"abcd"[oi]}</i>${esc(o)}</button>`).join("")}
          </div>`).join("")}</div>
        <div class="qfoot"><button type="button" class="btn" id="check">Comprobar</button><span class="score" id="score">0 / ${l.q.length} respondidas</span></div>
      </section>
      <section class="panel">
        <h2>Vocabulario</h2>
        <ul class="gloss">${l.gloss.map(g=>`<li><b>${esc(g[0])}</b><span>${esc(g[1])}</span></li>`).join("")}</ul>
      </section>
    </div>
  </div>`;
  fillVoiceSelect(); updatePlayerUI();

  document.getElementById("playbtn").onclick=()=>{ player.playing? pause() : resume(); };
  document.getElementById("restart").onclick=()=>speakFrom(0);
  $app.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{
    player.rate=+b.dataset.rate; store.set("vs-rate",player.rate);
    $app.querySelectorAll("[data-rate]").forEach(x=>x.classList.toggle("on",x===b));
    applyRate();
  });
  document.getElementById("voice").onchange=e=>{player.voice=e.target.value;store.set("vs-voice5",player.voice);if(player.playing||player.paused)speakFrom(player.idx);};
  $app.querySelectorAll(".s").forEach(s=>s.onclick=()=>speakFrom(+s.dataset.i));
  document.getElementById("tog").onclick=()=>{
    const p=document.getElementById("tpanel"); const b=p.classList.toggle("blur");
    store.set("vs-blur",b); document.getElementById("tog").textContent=b?"Mostrar texto":"Ocultar texto";
  };

  const ans = {}; let checked=false;
  const scoreEl=document.getElementById("score"), checkBtn=document.getElementById("check");
  $app.querySelectorAll(".q").forEach(qel=>{
    const qi=+qel.dataset.q;
    qel.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      if(checked) return;
      ans[qi]=+o.dataset.o;
      qel.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===o));
      scoreEl.textContent=`${Object.keys(ans).length} / ${l.q.length} respondidas`;
    });
  });
  checkBtn.onclick=()=>{
    if(checked){
      checked=false; Object.keys(ans).forEach(k=>delete ans[k]);
      $app.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel","ok","no"));
      scoreEl.textContent=`0 / ${l.q.length} respondidas`; checkBtn.textContent="Comprobar"; checkBtn.classList.remove("ghost");
      return;
    }
    if(Object.keys(ans).length<l.q.length){ scoreEl.textContent=`Responde todas las preguntas (${Object.keys(ans).length} / ${l.q.length})`; return; }
    checked=true; let ok=0;
    l.q.forEach((q,qi)=>{
      const opts=$app.querySelectorAll(`.q[data-q="${qi}"] .opt`);
      opts[q[2]].classList.add("ok");
      if(ans[qi]===q[2]) ok++; else opts[ans[qi]].classList.add("no");
    });
    scoreEl.textContent=`${ok} / ${l.q.length} correctas`;
    const done=store.get("vs-done",{}); done[l.id]=`${Math.max(ok,parseInt(done[l.id])||0)}/${l.q.length}`; store.set("vs-done",done);
    checkBtn.textContent="Intentar de nuevo"; checkBtn.classList.add("ghost");
  };
}


/* ---------- level tests ---------- */
const fmtDate = ts => new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function testState(t){
  const all = store.get("vs-tests-draft",{});
  return all[t.id] || null;
}
function saveDraft(t, d){ const all = store.get("vs-tests-draft",{}); if(d) all[t.id]=d; else delete all[t.id]; store.set("vs-tests-draft",all); }
function flatQ(t){ const out=[]; t.sections.forEach((s,si)=>s.q.forEach((q,qi)=>out.push({si,qi,q}))); return out; }
const needed = t => Math.ceil(t.pass*flatQ(t).length - 1e-9);

function renderTest(t){
  const draft = testState(t);
  if(draft && !draft.finished) return renderTestRun(t, draft);
  const last = store.get("vs-tests",{})[t.id];
  const total = flatQ(t).length;
  $app.innerHTML = `
  ${Object.keys(vault).length>1 ? '<a class="back" href="#">← Mi material</a>' : ""}
  <section class="lhead">
    <div class="meta"><span class="lv ${lvClass(t.level)}">${esc(t.level)}</span><span>Test de nivel</span></div>
    <h1>${esc(t.title)}</h1>
    <p class="lede">${esc(t.topic)}</p>
  </section>
  <div class="cols">
    <section class="panel">
      <h2>Antes de empezar</h2>
      <ul class="facts">
        <li><b>${total}</b><span>preguntas en ${t.sections.length} partes: ${t.sections.map(s=>esc(s.title.toLowerCase())).join(" y ")}</span></li>
        <li><b>${t.minutes} min</b><span>aproximadamente</span></li>
        <li><b>${needed(t)} / ${total}</b><span>para aprobar (${Math.round(t.pass*100)} %)</span></li>
      </ul>
      <div class="field">
        <label for="stname">Tu nombre</label>
        <input class="input" id="stname" autocomplete="name" value="${esc(store.get("vs-name",""))}" placeholder="Nombre y apellido">
      </div>
      <p class="err" id="nameerr" role="alert" hidden>Escribe tu nombre para que tu profesor/a sepa de quién es el resultado.</p>
      <div class="qfoot"><button type="button" class="btn" id="start">Empezar el test</button></div>
    </section>
    ${last ? `<section class="panel">
      <h2>Tu último resultado</h2>
      <p class="bigscore ${last.passed?"pass":"fail"}">${last.score}<small> / ${last.total}</small></p>
      <p class="hint">${last.passed?"Aprobado":"No aprobado"} · ${fmtDate(last.at)}</p>
      <div class="qfoot"><button type="button" class="btn ghost" id="seelast">Ver resultado</button></div>
    </section>` : ""}
  </div>`;
  document.getElementById("start").onclick = () => {
    const name = document.getElementById("stname").value.trim();
    if(!name){ document.getElementById("nameerr").hidden=false; document.getElementById("stname").focus(); return; }
    store.set("vs-name", name);
    const d = {name, started:Date.now(), ans:{}, finished:false};
    saveDraft(t, d); renderTestRun(t, d); window.scrollTo(0,0);
  };
  const see = document.getElementById("seelast");
  if(see) see.onclick = () => { renderTestResult(t, last); window.scrollTo(0,0); };
}

function renderTestRun(t, d){
  const total = flatQ(t).length;
  let n = 0;
  $app.innerHTML = `
  <div class="testbar" role="status"><div><b id="answered">0</b> / ${total} respondidas</div><div class="bar"><i id="tbfill"></i></div></div>
  <section class="lhead">
    <div class="meta"><span class="lv ${lvClass(t.level)}">${esc(t.level)}</span><span>${esc(d.name)}</span></div>
    <h1>${esc(t.title)}</h1>
  </section>
  ${t.sections.map((s,si)=>`
  <section class="panel tsec">
    <h2><span class="partno">Parte ${si+1}</span>${esc(s.title)}</h2>
    ${s.intro?`<p class="hint">${esc(s.intro)}</p>`:""}
    ${s.text?`<div class="reading">${s.text.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
    ${s.q.map((q,qi)=>{ n++; const key=`${si}.${qi}`; return `
      <div class="q" data-k="${key}">
        <p><small>${n}</small>${esc(q[0])}</p>
        ${q[1].map((o,oi)=>`<button type="button" class="opt ${d.ans[key]===oi?"sel":""}" data-o="${oi}"><i>${"abcd"[oi]}</i>${esc(o)}</button>`).join("")}
      </div>`; }).join("")}
  </section>`).join("")}
  <section class="panel">
    <div class="qfoot">
      <button type="button" class="btn" id="finish">Terminar el test</button>
      <span class="score" id="finmsg"></span>
    </div>
  </section>`;
  const upd = () => {
    const c = Object.keys(d.ans).length;
    document.getElementById("answered").textContent = c;
    document.getElementById("tbfill").style.width = Math.round(c/total*100)+"%";
  };
  $app.querySelectorAll(".q").forEach(qel=>{
    qel.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      d.ans[qel.dataset.k] = +o.dataset.o;
      qel.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===o));
      qel.classList.remove("miss");
      saveDraft(t, d); upd();
    });
  });
  upd();
  document.getElementById("finish").onclick = () => {
    const missing = [...$app.querySelectorAll(".q")].filter(q=>d.ans[q.dataset.k]===undefined);
    if(missing.length){
      missing.forEach(q=>q.classList.add("miss"));
      document.getElementById("finmsg").textContent = `Te ${missing.length===1?"falta 1 pregunta":`faltan ${missing.length} preguntas`}`;
      missing[0].scrollIntoView({block:"center", behavior:"smooth"});
      return;
    }
    const sections = t.sections.map((s,si)=>({title:s.title, total:s.q.length, score:s.q.filter((q,qi)=>d.ans[`${si}.${qi}`]===q[2]).length}));
    const score = sections.reduce((a,s)=>a+s.score,0);
    const r = {name:d.name, score, total, passed: score>=needed(t), sections, at:Date.now(), mins:Math.max(1,Math.round((Date.now()-d.started)/60000)), ans:d.ans};
    const all = store.get("vs-tests",{}); all[t.id] = r; store.set("vs-tests",all);
    saveDraft(t, null);
    renderTestResult(t, r); window.scrollTo(0,0);
  };
}

function resultText(t, r){
  return [
    `Verba School · ${t.title}`,
    `Alumno/a: ${r.name}`,
    `Resultado: ${r.score}/${r.total} (${Math.round(r.score/r.total*100)} %) · ${r.passed?"APROBADO":"NO APROBADO"}`,
    r.sections.map(s=>`${s.title}: ${s.score}/${s.total}`).join(" · "),
    `Fecha: ${fmtDate(r.at)} · Tiempo: ${r.mins} min`
  ].join("\n");
}

function renderTestResult(t, r){
  const pct = Math.round(r.score/r.total*100), passPct = Math.round(needed(t)/r.total*100);
  $app.innerHTML = `
  ${Object.keys(vault).length>1 ? '<a class="back" href="#">← Mi material</a>' : ""}
  <section class="result ${r.passed?"pass":"fail"}">
    <div class="meta"><span class="lv ${lvClass(t.level)}">${esc(t.level)}</span><span>${esc(t.title)}</span><span>· ${esc(r.name)}</span></div>
    <h1>${r.passed?"¡Aprobado!":"Todavía no"}</h1>
    <p class="lede">${r.passed?`Has superado el nivel ${esc(t.level)}.`:`Todavía no has superado el nivel ${esc(t.level)}. Necesitas ${needed(t)} respuestas correctas de ${r.total}.`}</p>
    <p class="bigscore">${r.score}<small> / ${r.total} · ${pct} %</small></p>
    <div class="scorebar" aria-hidden="true"><i style="width:${pct}%"></i><b style="left:${passPct}%"></b></div>
    <p class="hint">La marca indica el mínimo para aprobar (${needed(t)} de ${r.total}).</p>
  </section>
  <div class="cols">
    <section class="panel">
      <h2>Por partes</h2>
      <ul class="facts">${r.sections.map(s=>`<li><b>${s.score} / ${s.total}</b><span>${esc(s.title)}</span></li>`).join("")}
        <li><b>${r.mins} min</b><span>Tiempo · ${fmtDate(r.at)}</span></li></ul>
    </section>
    <section class="panel">
      <h2>Envía el resultado a tu profesor/a</h2>
      <pre class="restext" id="restext">${esc(resultText(t,r))}</pre>
      <div class="qfoot">
        <button type="button" class="btn" id="copyres">Copiar resultado</button>
        <button type="button" class="btn ghost" id="review">Ver respuestas</button>
        <button type="button" class="btn ghost" id="retry">Repetir el test</button>
      </div>
    </section>
  </div>
  <div id="reviewbox"></div>`;
  document.getElementById("copyres").onclick = async e => {
    const btn = e.currentTarget;
    try{ await navigator.clipboard.writeText(resultText(t,r)); btn.textContent="Copiado ✓"; setTimeout(()=>btn.textContent="Copiar resultado",1800); }
    catch(x){ const sel=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(document.getElementById("restext")); sel.removeAllRanges(); sel.addRange(rg); btn.textContent="Selecciona y copia"; }
  };
  document.getElementById("retry").onclick = () => { renderTest(t); window.scrollTo(0,0); };
  document.getElementById("review").onclick = e => {
    e.currentTarget.disabled = true;
    let n = 0;
    const box = document.getElementById("reviewbox");
    box.innerHTML = t.sections.map((s,si)=>`
      <section class="panel tsec">
        <h2><span class="partno">Parte ${si+1}</span>${esc(s.title)}</h2>
        ${s.text?`<div class="reading">${s.text.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
        ${s.q.map((q,qi)=>{ n++; const a=(r.ans||{})[`${si}.${qi}`]; return `
          <div class="q">
            <p><small>${n}</small>${esc(q[0])}</p>
            ${q[1].map((o,oi)=>`<div class="opt ${oi===q[2]?"ok":(oi===a?"no":"")}"><i>${"abcd"[oi]}</i>${esc(o)}${oi===a&&oi!==q[2]?' <span class="tag">tu respuesta</span>':""}</div>`).join("")}
          </div>`; }).join("")}
      </section>`).join("");
    box.scrollIntoView({block:"start", behavior:"smooth"});
  };
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^([a-z0-9-]+)~([A-Za-z0-9_-]{43})$/);
  if(m) openLesson(m[1], m[2]);
  else if(vault[h]) openLesson(h, vault[h].k);
  else { openToken++; renderHome(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
window.addEventListener("pagehide",()=>synth&&synth.cancel());
route();
</script>
